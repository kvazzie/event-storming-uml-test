# Rebuilds both event-storming boards from source on every change and
# publishes them: committed mirror in .generated/ (shown in README) plus
# a downloadable artifact. A red build means a board source broke
# (the same failure you'd get from ./render.sh locally).
#
# The commit-back only touches .generated/, which is outside the paths
# filter below, so it never retriggers itself (plus pushes made with
# GITHUB_TOKEN don't start new runs).
name: Render event-storming boards

on:
  push:
    paths:
      - 'plantuml/**'
      - 'd2/**'
      - '.github/workflows/render.yml'
  pull_request:
    paths:
      - 'plantuml/**'
      - 'd2/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLANTUML_VERSION: '1.2025.5'
  D2_VERSION: '0.9.0'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install PlantUML
        run: |
          mkdir -p /tmp/opencode
          curl -fsSL -o /tmp/opencode/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Install D2
        run: |
          mkdir -p ~/.local/bin
          cd /tmp
          curl -fsSL -o d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf d2.tar.gz
          install "d2-v${D2_VERSION}/bin/d2" ~/.local/bin/d2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render PlantUML board
        run: ./render.sh
        working-directory: plantuml

      - name: Render D2 board
        run: ./render.sh
        working-directory: d2

      - name: Collect boards into .generated/
        run: |
          mkdir -p .generated
          cp plantuml/event-storming.png .generated/plantuml-event-storming.png
          cp plantuml/event-storming.svg .generated/plantuml-event-storming.svg
          cp d2/event-storming.png .generated/d2-event-storming.png
          cp d2/event-storming.svg .generated/d2-event-storming.svg
          ls .generated

      - name: Upload rendered boards
        uses: actions/upload-artifact@v4
        with:
          name: event-storming-boards
          path: .generated/
          retention-days: 30

      - name: Commit generated boards
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .generated
          git diff --cached --quiet || git commit -m "Regenerate .generated/ boards [skip ci]"
          git pull --rebase
          git push
