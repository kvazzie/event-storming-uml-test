# Rebuilds both event-storming boards from source on every change.
# Rendered PNG/SVG are git-ignored; this workflow publishes them as a
# downloadable artifact, and a red build means a board source broke
# (the same failure you'd get from ./render.sh locally).
name: Render event-storming boards

on:
  push:
    paths:
      - 'plantuml/**'
      - 'd2/**'
      - '.github/workflows/render.yml'
  pull_request:
    paths:
      - 'plantuml/**'
      - 'd2/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

env:
  PLANTUML_VERSION: '1.2025.5'
  D2_VERSION: '0.9.0'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install PlantUML
        run: |
          mkdir -p /tmp/opencode
          curl -fsSL -o /tmp/opencode/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Install D2
        run: |
          mkdir -p ~/.local/bin
          cd /tmp
          curl -fsSL -o d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf d2.tar.gz
          install "d2-v${D2_VERSION}/bin/d2" ~/.local/bin/d2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render PlantUML board
        run: ./render.sh
        working-directory: plantuml

      - name: Render D2 board
        run: ./render.sh
        working-directory: d2

      - name: Upload rendered boards
        uses: actions/upload-artifact@v4
        with:
          name: event-storming-boards
          path: |
            plantuml/event-storming.png
            plantuml/event-storming.svg
            d2/event-storming.png
            d2/event-storming.svg
          retention-days: 30
